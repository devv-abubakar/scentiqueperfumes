<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F5EF">
<title>Scentique — Luxury Perfumes</title>
<meta name="description" content="Scentique — long-lasting luxury fragrances, attars and oils. Cash on Delivery across Pakistan.">
<meta property="og:title" content="Scentique — The Essence of Elegance">
<meta property="og:description" content="Long-lasting luxury fragrances. Cash on Delivery across Pakistan.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   SCENTIQUE — Premium fragrance e-commerce UI
   Ivory · White · Deep Charcoal · Champagne Gold
   Playfair Display (headings) + Inter (UI/body)
   Mobile-first. Subtle motion (150–350ms, ease-out).
   ========================================================================== */

:root{
  /* colour */
  --ivory:#F8F5EF;
  --white:#FFFFFF;
  --charcoal:#171717;
  --soft:#4A4A4A;
  --gold:#C6A15B;
  --gold-soft:rgba(198,161,91,.14);
  --beige:#E9E1D5;
  --sand:#D8CBB9;
  --gray:#F1F1EF;
  --border:#E5E0D8;
  --border-2:#EFEAE1;

  /* type */
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;

  /* spacing (8px base) */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px; --s7:80px; --s8:96px;
  --gut:clamp(16px,4.6vw,40px);
  --max:1440px;
  --sec:clamp(40px,8vw,104px);

  /* radius */
  --r-card:12px;
  --r-btn:9px;
  --r-input:9px;
  --r-chip:100px;

  /* elevation */
  --sh-s:0 1px 2px rgba(23,23,23,.04);
  --sh-m:0 8px 30px -14px rgba(23,23,23,.16);
  --sh-l:0 24px 70px -28px rgba(23,23,23,.24);

  --t:220ms cubic-bezier(.2,.8,.3,1);
  --t-slow:340ms cubic-bezier(.2,.8,.3,1);

  --bottomnav:0px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--ivory);color:var(--charcoal);
  font-family:var(--sans);font-size:15px;font-weight:400;line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding-bottom:var(--bottomnav);
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::selection{background:var(--gold);color:#fff}

h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;line-height:1.14;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,7vw,4rem)}
h2{font-size:clamp(1.6rem,4vw,2.6rem)}
h3{font-size:clamp(1.05rem,2vw,1.35rem)}
p{margin:0 0 1em}

.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}
.section{padding-block:var(--sec);position:relative}
.section.tight{padding-top:0}
.eyebrow{
  display:block;font-size:.66rem;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold)
}
.muted{color:var(--soft)}
.center{text-align:center}
.serif{font-family:var(--serif)}

.section-head{margin-bottom:clamp(24px,4vw,var(--s5));max-width:620px}
.section-head.center{margin-inline:auto;text-align:center}
.section-head h2{margin:12px 0 10px}
.section-head p{color:var(--soft);margin:0;font-size:.95rem}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);
  flex-wrap:wrap;margin-bottom:clamp(24px,4vw,var(--s5))}
.head-row .section-head{margin-bottom:0}
.rule{height:1px;background:var(--border);border:0;margin:0}

/* ---------------------------------------------------------- buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 28px;border-radius:var(--r-btn);
  background:var(--charcoal);color:#fff;border:1px solid var(--charcoal);
  font-size:.78rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  transition:background var(--t),color var(--t),border-color var(--t),transform 140ms ease-out,box-shadow var(--t);
  white-space:nowrap
}
.btn:hover{background:#000;box-shadow:var(--sh-m)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-outline{background:var(--white);color:var(--charcoal);border-color:var(--charcoal)}
.btn-outline:hover{background:var(--charcoal);color:#fff}
.btn-quiet{background:transparent;color:var(--charcoal);border-color:var(--border)}
.btn-quiet:hover{background:var(--white);border-color:var(--charcoal);box-shadow:none}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-gold:hover{background:#b8904a;border-color:#b8904a}
.btn-wa{background:#128C4A;border-color:#128C4A;color:#fff}
.btn-wa:hover{background:#0e7440;border-color:#0e7440}
.btn-sm{min-height:40px;padding:0 18px;font-size:.7rem}
.btn-lg{min-height:54px;padding:0 34px}
.btn-block{width:100%}
.link-more{
  display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;padding-bottom:3px;
  border-bottom:1px solid var(--charcoal);transition:color var(--t),border-color var(--t),gap var(--t)
}
.link-more:hover{color:var(--gold);border-color:var(--gold);gap:11px}

/* ---------------------------------------------------------- header */
.announce{
  background:var(--charcoal);color:var(--beige);text-align:center;
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px
}
.header{
  position:sticky;top:0;z-index:60;background:rgba(248,245,239,.9);
  backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color var(--t),background var(--t)
}
.header.scrolled{border-bottom-color:var(--border);background:rgba(248,245,239,.97)}
.header-in{display:flex;align-items:center;gap:var(--s2);height:62px}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--serif);
  font-size:1.3rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.logo img{height:30px;width:auto}
.logo .dot{width:4px;height:4px;border-radius:50%;background:var(--gold);flex:none;align-self:flex-end;margin-bottom:5px}

.nav{display:none;gap:clamp(16px,2.2vw,30px);margin-left:auto}
.nav a{
  position:relative;font-size:.75rem;font-weight:450;letter-spacing:.13em;
  text-transform:uppercase;color:var(--soft);padding:6px 0;transition:color var(--t)
}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);
  transform:scaleX(0);transform-origin:right;transition:transform var(--t-slow)}
.nav a:hover,.nav a.active{color:var(--charcoal)}
.nav a:hover::after,.nav a.active::after{transform:scaleX(1);transform-origin:left}

.head-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav ~ .head-actions{margin-left:clamp(14px,2vw,26px)}
.icon-btn{
  width:46px;height:46px;display:grid;place-items:center;border-radius:50%;
  position:relative;color:var(--charcoal);transition:background var(--t),color var(--t)
}
.icon-btn:hover{background:var(--gray);color:var(--gold)}
.icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.count{
  position:absolute;top:6px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--gold);color:#fff;font-size:.6rem;font-weight:600;display:grid;place-items:center;
  animation:pop 260ms cubic-bezier(.2,1.4,.4,1)
}
@keyframes pop{from{transform:scale(0)}}
.hide-sm{display:none}

/* drawer */
.drawer{
  position:fixed;inset:0 0 0 auto;width:min(330px,86vw);background:var(--ivory);z-index:90;
  padding:var(--s3);display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform var(--t-slow);box-shadow:var(--sh-l)
}
.drawer.open{transform:none}
.drawer a{padding:15px 0;border-bottom:1px solid var(--border);
  font-family:var(--serif);font-size:1.1rem;font-weight:500}
.scrim{position:fixed;inset:0;background:rgba(23,23,23,.4);z-index:80;
  opacity:0;pointer-events:none;transition:opacity var(--t-slow)}
.scrim.on{opacity:1;pointer-events:auto}

/* ------------------------------------------------------ bottom nav */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)
}
.bottomnav a{
  flex:1;display:grid;justify-items:center;gap:3px;padding:9px 4px 8px;position:relative;
  color:var(--soft);transition:color var(--t)
}
.bottomnav a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.bottomnav a span{font-size:.6rem;letter-spacing:.05em}
.bottomnav a.active{color:var(--charcoal)}
.bottomnav a.active svg{stroke:var(--gold)}
.bottomnav .count{top:4px;right:calc(50% - 20px)}

/* ---------------------------------------------------------- hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ivory) 0%,var(--beige) 100%)}
.hero-in{display:grid;gap:var(--s3);padding-block:clamp(36px,7vw,90px);align-items:center}
.hero-copy h1{margin:14px 0 16px}
.hero-copy h1 em{font-style:italic;color:var(--gold)}
.hero-copy p{color:var(--soft);max-width:46ch;margin-bottom:var(--s3);font-size:clamp(.92rem,1.2vw,1.05rem)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-art{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--white);
  aspect-ratio:4/3;box-shadow:var(--sh-m)}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-art .frame{position:absolute;inset:12px;border:1px solid rgba(198,161,91,.45);
  border-radius:8px;pointer-events:none}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 500ms ease-out}
.hero-slide.on{opacity:1}
.hero-dots{display:flex;gap:7px;margin-top:var(--s2)}
.hero-dots button{width:26px;height:2px;background:var(--sand);border-radius:2px;transition:background var(--t)}
.hero-dots button.on{background:var(--gold)}
.hero-copy > *{opacity:0;transform:translateY(14px);animation:rise 460ms ease-out forwards}
.hero-copy > *:nth-child(1){animation-delay:60ms}
.hero-copy > *:nth-child(2){animation-delay:130ms}
.hero-copy > *:nth-child(3){animation-delay:200ms}
.hero-copy > *:nth-child(4){animation-delay:270ms}
.hero-copy > *:nth-child(5){animation-delay:340ms}
@keyframes rise{to{opacity:1;transform:none}}

/* ------------------------------------------------------ trust strip */
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);
  border-block:1px solid var(--border)}
.trust div{background:var(--ivory);padding:var(--s2) var(--s2);text-align:center}
.trust b{display:block;font-family:var(--serif);font-size:.98rem;font-weight:500}
.trust span{font-size:.7rem;color:var(--soft)}

/* ------------------------------------------------------ product card */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{
  background:var(--white);border:1px solid var(--border-2);border-radius:var(--r-card);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:border-color var(--t),box-shadow var(--t-slow),transform var(--t-slow)
}
.card:hover{border-color:var(--border);box-shadow:var(--sh-m);transform:translateY(-3px)}
.card-media{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--gray);display:block}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform 420ms ease-out}
.card:hover .card-media img{transform:scale(1.045)}
.badge{
  position:absolute;top:10px;left:10px;z-index:2;background:var(--white);color:var(--gold);
  border:1px solid var(--gold);font-size:.55rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;padding:4px 9px;border-radius:var(--r-chip)
}
.badge.sale{background:var(--gold);color:#fff}
.wish{
  position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--soft);
  transition:color var(--t),transform 160ms ease-out,background var(--t)
}
.wish svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.wish:hover{color:var(--gold)}
.wish.on{color:var(--gold)}
.wish.on svg{fill:var(--gold);stroke:var(--gold);animation:heart 300ms cubic-bezier(.2,1.5,.4,1)}
@keyframes heart{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.card-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-fam{font-size:.58rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card-title{font-family:var(--serif);font-size:.98rem;font-weight:500;line-height:1.3}
.card-sub{font-size:.72rem;color:var(--soft)}
.card-desc{font-size:.78rem;color:var(--soft);display:none}
.price{display:flex;align-items:baseline;gap:7px;margin-top:4px;font-size:.92rem;font-weight:600}
.price .was{font-weight:400;font-size:.76rem;color:var(--soft);text-decoration:line-through}
.stars{color:var(--gold);font-size:.72rem;letter-spacing:.08em}
.stars small{color:var(--soft);letter-spacing:0}
.card .btn{margin-top:10px}

/* --------------------------------------------------- category cards */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{
  position:relative;aspect-ratio:3/4;border-radius:var(--r-card);overflow:hidden;
  display:flex;align-items:flex-end;padding:var(--s2);isolation:isolate;background:var(--gray)
}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;
  transition:transform 500ms ease-out}
.cat::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,rgba(23,23,23,.78),rgba(23,23,23,.06) 62%)}
.cat:hover img{transform:scale(1.05)}
.cat h3{color:#fff;font-size:1.05rem}
.cat small{display:block;color:rgba(255,255,255,.78);font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;margin-top:4px}

/* ------------------------------------------------ discovery chips */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding-bottom:6px;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);
  scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > *{scroll-snap-align:start;flex:none}
.fam{
  width:118px;padding:var(--s2) 12px;border:1px solid var(--border);border-radius:var(--r-card);
  background:var(--white);text-align:center;transition:border-color var(--t),transform var(--t)
}
.fam:hover{border-color:var(--gold);transform:translateY(-2px)}
.fam .ring{width:40px;height:40px;margin:0 auto 10px;border-radius:50%;border:1px solid var(--gold);
  display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-size:.9rem}
.fam b{display:block;font-family:var(--serif);font-size:.92rem;font-weight:500}
.fam span{font-size:.66rem;color:var(--soft)}

/* -------------------------------------------------- notes / pyramid */
.notes{display:grid;gap:12px}
.note{background:var(--white);border:1px solid var(--border-2);border-radius:var(--r-card);
  padding:var(--s3) var(--s2);text-align:center}
.note .ring{width:56px;height:56px;margin:0 auto var(--s2);border-radius:50%;
  border:1px solid var(--gold);display:grid;place-items:center;
  font-family:var(--serif);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.note h3{margin-bottom:6px}
.note p{color:var(--soft);font-size:.85rem;margin:0}

/* ------------------------------------------------------ brand story */
.story{display:grid;gap:var(--s3);align-items:center}
.story-img{border-radius:var(--r-card);overflow:hidden;aspect-ratio:4/3;background:var(--gray)}
.story-img img{width:100%;height:100%;object-fit:cover}

/* ------------------------------------------------------ promo band */
.promo{
  position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--charcoal);
  color:#fff;padding:clamp(32px,6vw,72px) var(--s3);text-align:center;isolation:isolate
}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.5}
.promo::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(23,23,23,.55)}
.promo h2{color:#fff;margin:12px auto 12px;max-width:16ch}
.promo p{color:rgba(255,255,255,.76);max-width:44ch;margin-inline:auto}
.promo .btn{background:var(--white);color:var(--charcoal);border-color:var(--white)}
.promo .btn:hover{background:var(--gold);border-color:var(--gold);color:#fff}

/* --------------------------------------------------------- product */
.pd{display:grid;gap:var(--s3)}
.gallery{position:relative}
.gal-main{border-radius:var(--r-card);overflow:hidden;background:var(--gray);aspect-ratio:1/1;
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-main::-webkit-scrollbar{display:none}
.gal-main img{width:100%;height:100%;flex:none;object-fit:cover;scroll-snap-align:center}
.gal-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.gal-dots i{width:6px;height:6px;border-radius:50%;background:var(--sand);transition:background var(--t),width var(--t)}
.gal-dots i.on{background:var(--gold);width:18px;border-radius:3px}
.thumbs{display:none;gap:8px;margin-top:10px}
.thumbs img{width:66px;height:66px;object-fit:cover;border-radius:8px;cursor:pointer;
  border:1px solid transparent;opacity:.6;transition:opacity var(--t),border-color var(--t)}
.thumbs img.on,.thumbs img:hover{opacity:1;border-color:var(--gold)}

.pd-title{font-size:clamp(1.6rem,4.4vw,2.4rem);margin:8px 0 6px}
.pd-sub{font-size:.82rem;color:var(--soft);letter-spacing:.05em}
.pd-price{display:flex;align-items:baseline;gap:10px;margin:var(--s2) 0;
  font-size:1.4rem;font-weight:600}
.pd-price .was{font-size:.95rem;font-weight:400;color:var(--soft);text-decoration:line-through}
.pd-price .off{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold);border-radius:var(--r-chip);padding:3px 9px}
.opt-label{font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);margin-bottom:9px;display:block}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--s3)}
.size{
  min-width:66px;min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:var(--r-btn);
  background:var(--white);font-size:.82rem;transition:all var(--t)
}
.size:hover{border-color:var(--gold)}
.size.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.size:disabled{opacity:.35;pointer-events:none;text-decoration:line-through}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-btn);
  background:var(--white);overflow:hidden}
.qty button{width:46px;height:48px;font-size:1.05rem;transition:background var(--t)}
.qty button:hover{background:var(--gray)}
.qty span{width:40px;text-align:center;font-weight:500}
.pd-actions{display:grid;gap:10px;margin:var(--s3) 0}
.pd-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;margin:var(--s3) 0}
.pd-meta div{background:var(--white);padding:14px}
.pd-meta dt{font-size:.58rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:4px}
.pd-meta dd{margin:0;font-size:.86rem}
.pyramid{display:grid;gap:10px;margin:var(--s3) 0}
.pyr{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
  background:var(--white);border:1px solid var(--border-2);border-radius:var(--r-card);padding:14px 16px}
.pyr .ring{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:grid;
  place-items:center;font-size:.54rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);flex:none}
.pyr b{display:block;font-family:var(--serif);font-size:.95rem;font-weight:500}
.pyr span{font-size:.82rem;color:var(--soft)}

.buybar{
  position:fixed;left:0;right:0;bottom:var(--bottomnav);z-index:65;display:none;align-items:center;gap:10px;
  padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--border);
  transform:translateY(120%);transition:transform var(--t-slow)
}

  if (e.isIntersecting) { e.target.classList.add("seen"); io.unobserve(e.target); }

/* ------------------------------------------------------- data load */
async function loadAll() {
  const grab = async (table, build) => {
    try { const { data } = await build(db(table)); return (data && data.length) ? data : null; }
    catch { return null; }
  };
  let set = null;
  try { const { data } = await db("perfume_settings").select("*").eq("id", 1).maybeSingle(); set = data; } catch {}

  const [cats, prods, bans, foot, faqs, pages] = await Promise.all([
    grab("perfume_categories",  q => q.select("*").eq("is_active", true).order("sort_order")),
    grab("perfume_products",    q => q.select("*").eq("is_active", true).order("sort_order")),
    grab("perfume_banners",     q => q.select("*").eq("is_active", true).order("sort_order")),
    grab("perfume_footer_links",q => q.select("*").eq("is_active", true).order("sort_order")),
    grab("perfume_faqs",        q => q.select("*").eq("is_active", true).order("sort_order")),
    grab("perfume_pages",       q => q.select("*").eq("is_active", true))
  ]);

  if (set) Object.keys(set).forEach(k => { if (set[k] !== null && set[k] !== "") S.settings[k] = set[k]; });

  S.categories   = cats  || FALLBACK.categories;
  S.products     = prods || FALLBACK.products;
  S.banners      = bans  || FALLBACK.banners;
  S.footer_links = foot  || FALLBACK.footer_links;
  S.faqs         = faqs  || FALLBACK.faqs;
  S.pages        = pages || FALLBACK.pages;

  try {
    const { data } = await db("perfume_product_images").select("*").order("sort_order");
    (data || []).forEach(r => (S.images[r.product_id] ||= []).push(r.image_url));
  } catch {}
  try {
    const { data } = await db("perfume_reviews").select("*").eq("is_approved", true)
      .order("created_at", { ascending: false });
    S.reviews = data || [];
  } catch { S.reviews = []; }
}

const catBySlug  = sl => S.categories.find(c => c.slug === sl);

const prodById   = id => S.products.find(p => p.id === id);
const priceOf    = p => Number(p.sale_price || p.price || 0);
const onSale     = p => p.sale_price && Number(p.sale_price) < Number(p.price);
const offPct     = p => Math.round((1 - Number(p.sale_price) / Number(p.price)) * 100);
const imagesOf   = p => {
  const l = [p.main_image, ...(S.images[p.id] || [])].filter(Boolean);
  return l.length ? l : [PLACEHOLDER(p.name)];
};
const reviewsOf = id => S.reviews.filter(r => r.product_id === id);
const ratingOf  = id => {
  const rs = reviewsOf(id);
  return rs.length ? Math.round(rs.reduce((s, r) => s + r.rating, 0) / rs.length) : 5;
};
const isWished = id => wish.includes(id);

}

  if (Number(p.stock) === 0) return toast("Ye fragrance filhaal out of stock hai.", true);
  const f = cart.find(i => i.id === p.id);
  if (f) f.qty += qty;
  else cart.push({ id: p.id, slug: p.slug, name: p.name, price: priceOf(p),
                   image: imagesOf(p)[0], size_ml: p.size_ml, qty });
  saveCart(); toast(`${p.name} cart mein add ho gaya.`);
}

  const i = wish.indexOf(id);
  if (i > -1) { wish.splice(i, 1); toast("Wishlist se hata diya."); }

  saveWish();
  $$(`[data-wish="${id}"]`).forEach(b => b.classList.toggle("on", isWished(id)));
}

function filterProducts(params) {
  const cat = params.get("cat") || "", q = (params.get("q") || "").toLowerCase();
  const g = params.get("g") || "", fam = params.get("fam") || "";
  const max = Number(params.get("max") || 0), sort = params.get("sort") || "featured";
  const inStock = params.get("stock") === "1";

  let list = [...S.products];
  if (cat) { const c = catBySlug(cat); list = list.filter(p => p.category_id === c?.id); }
  if (g)   list = list.filter(p => (p.gender || "unisex") === g);
  if (fam) list = list.filter(p => (p.fragrance_family || "") === fam);
  if (max) list = list.filter(p => priceOf(p) <= max);
  if (inStock) list = list.filter(p => Number(p.stock) > 0);
  if (q) list = list.filter(p => (`${p.name} ${p.fragrance_family || ""} ${p.short_desc || ""} ` +
    `${p.top_notes || ""} ${p.heart_notes || ""} ${p.base_notes || ""}`).toLowerCase().includes(q));

  if (sort === "low")  list.sort((a, b) => priceOf(a) - priceOf(b));
  if (sort === "high") list.sort((a, b) => priceOf(b) - priceOf(a));
  if (sort === "new")  list.reverse();
  return list;
}

    "Your Collection Awaits", "Cart abhi khali hai. Apni signature khushbu chunein.",
    "Explore Fragrances", "#/shop")}</div></section>`;

  const sub = cartSubtotal(), ship = shippingFor(sub);
  const free = Number(S.settings.free_shipping_over || 0);
  const away = free && sub < free ? free - sub : 0;

  return `
  <section class="section">
    <div class="wrap">
      <div class="crumbs"><a href="#/">Home</a> / Cart</div>
      <div class="section-head"><span class="eyebrow">${cart.length} item${cart.length === 1 ? "" : "s"}</span>
        <h2>Shopping bag</h2></div>
      <div class="cols">
        <div>
          ${away ? `<p class="muted" style="font-size:.85rem;background:var(--gold-soft);
            border-radius:var(--r-btn);padding:12px 14px">${money(away)} aur add karein — delivery free ho jayegi.</p>` : ""}
          ${cart.map(i => `
            <div class="cart-row">
              <img src="${esc(i.image)}" alt="${esc(i.name)}">
              <div>
                <a class="nm" href="#/product/${esc(i.slug)}">${esc(i.name)}</a>
                <div class="sz">${esc(i.size_ml || "")}ml · ${money(i.price)}</div>
                <div class="cart-foot">
                  <div class="qty"><button data-dec="${esc(i.id)}" aria-label="Less">−</button>
                    <span>${i.qty}</span><button data-inc="${esc(i.id)}" aria-label="More">+</button></div>
                  <button class="rm" data-del="${esc(i.id)}">Remove</button>
                  <span class="amt">${money(i.price * i.qty)}</span>
                </div>
              </div>
            </div>`).join("")}
        </div>
        <aside class="summary">
          <h3 style="margin-bottom:14px">Order summary</h3>
          <div class="sum-row"><span>Subtotal</span><span>${money(sub)}</span></div>
          <div class="sum-row"><span>Shipping</span><span>${ship ? money(ship) : "Free"}</span></div>
          <div class="sum-row total"><span>Total</span><span>${money(sub + ship)}</span></div>
          <a class="btn btn-lg btn-block" href="#/checkout" style="margin-top:16px">Checkout</a>
          <a class="btn btn-quiet btn-block" href="#/shop" style="margin-top:9px">Continue shopping</a>
          <p class="muted" style="font-size:.78rem;margin:14px 0 0">${esc(S.settings.cod_note)}</p>
        </aside>
      </div>
    </div>
  </section>`;
};

function waOrderText() {
  const sub = cartSubtotal(), ship = shippingFor(sub);
  return "Assalam o Alaikum! Mujhe ye order karna hai:\n\n" +
    cart.map(i => `• ${i.name} (${i.size_ml}ml) × ${i.qty} — ${money(i.price * i.qty)}`).join("\n") +
    `\n\nShipping: ${ship ? money(ship) : "Free"}\nTotal: ${money(sub + ship)}\nPayment: Cash on Delivery`;
}

function emptyState(title, text, cta, href) {
  return `<div class="empty">
    <span class="ic">${ICON.drop}</span>
    <h3>${esc(title)}</h3><p>${text}</p>
    ${cta ? `<a class="btn" href="${href}">${esc(cta)}</a>` : ""}

/* ---------------------------------------------------------- router */
function route() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, query] = raw.split("?");
  const seg = path.split("/").filter(Boolean);
  const params = new URLSearchParams(query || "");
  let html;

  switch (seg[0]) {
    case undefined:     html = V.home(); break;
    case "shop":        html = V.shop(params); break;
    case "collections": html = V.collections(); break;
    case "product":     html = V.product(decodeURIComponent(seg[1] || "")); break;
    case "search":      html = V.search(params); break;
    case "wishlist":    html = V.wishlist(); break;
    case "cart":        html = V.cart(); break;
    case "checkout":    html = V.checkout(); break;
    case "success":     html = V.success(decodeURIComponent(seg[1] || "")); break;
    case "about":       html = V.about(); break;
    case "contact":     html = V.contact(); break;
    case "faqs":        html = V.faqs(); break;
    case "page":        html = V.page(seg[1] || ""); break;
    default:            html = V.notfound();
  }

  $("#app").innerHTML = html;
  scrollTo({ top: 0, behavior: "auto" });

  const base = "#/" + (seg[0] || "");
  $$("#nav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === base));
  $$("#bottomnav a").forEach(a => a.classList.toggle("active", a.dataset.bn === base));

  paintBuybar(seg);
  bindView(seg, params);
  watchReveals();
}

function paintBuybar(seg) {
  const bar = $("#buybar");
  if (seg[0] !== "product") { bar.classList.remove("on"); bar.innerHTML = ""; return; }
  const p = prodBySlug(decodeURIComponent(seg[1] || ""));
  if (!p) return;
  bar.innerHTML = `<div class="info"><div class="nm">${esc(p.name)}</div>
      <div class="pr">${money(priceOf(p))}</div></div>
    <button class="btn btn-sm" id="barAdd" ${Number(p.stock) === 0 ? "disabled" : ""}>
      ${Number(p.stock) === 0 ? "Sold out" : "Add to Cart"}</button>`;
  $("#barAdd")?.addEventListener("click", () => addToCart(p, 1));
}

/* -------------------------------------------------- view bindings */
function bindView(seg, params) {
  $$("[data-add]").forEach(b => b.addEventListener("click", () => {
    const p = prodBySlug(b.dataset.add); if (p) addToCart(p, 1);
  }));
  $$("[data-wish]").forEach(b => b.addEventListener("click", () => toggleWish(b.dataset.wish)));
  $$(".acc > button").forEach(b => b.addEventListener("click", () => b.parentElement.classList.toggle("open")));

  /* home hero rotator */
  const copy = $("#heroCopy");
  if (copy) {
    const slides = $$(".hero-slide");
    let i = 0;
    const paint = k => {
      const b = S.banners[k] || {};
      copy.innerHTML = `
        <span class="eyebrow">${esc(b.eyebrow || "Scentique")}</span>
        <h1>${b.title || esc(S.settings.tagline)}</h1>
        <p>${esc(b.subtitle || S.settings.about_short)}</p>
        <div class="hero-cta">
          <a class="btn btn-lg" href="${esc(b.button_link || "#/shop")}">${esc(b.button_text || "Shop Collection")}</a>
          <a class="btn btn-outline btn-lg" href="#/collections">Explore Fragrances</a>
        </div>
        ${S.banners.length > 1 ? `<div class="hero-dots">${S.banners.map((_, n) =>
          `<button data-s="${n}" class="${n === k ? "on" : ""}" aria-label="Slide ${n + 1}"></button>`).join("")}</div>` : ""}`;
      $$("[data-s]", copy).forEach(d => d.addEventListener("click", () => go(+d.dataset.s)));
    };
    const go = k => {
      i = (k + slides.length) % slides.length;
      slides.forEach((s, n) => s.classList.toggle("on", n === i));
      paint(i);
    };
    paint(0);
    clearInterval(window.__hero);
    if (slides.length > 1) window.__hero = setInterval(() => go(i + 1), 6000);
  }

  /* shop */
  $("#sortSel")?.addEventListener("change", e => setParam("sort", e.target.value));
  $("#openFilters")?.addEventListener("click", () => openSheet(params));
  bindFilterButtons(document);
  const range = $("#priceRange");
  range?.addEventListener("input", e => $("#priceOut").textContent = money(e.target.value));
  range?.addEventListener("change", e => setParam("max", e.target.value));

  /* product */
  if (seg[0] === "product") {
    const p = prodBySlug(decodeURIComponent(seg[1] || ""));
    let q = 1;
    $("#qPlus")?.addEventListener("click", () => { q++; $("#qVal").textContent = q; });
    $("#qMinus")?.addEventListener("click", () => { if (q > 1) { q--; $("#qVal").textContent = q; } });
    $("#pdAdd")?.addEventListener("click", () => p && addToCart(p, q));
    $("#pdBuy")?.addEventListener("click", () => { if (!p) return; addToCart(p, q); location.hash = "#/checkout"; });

    const main = $("#galMain");
    $$("#thumbs img").forEach(t => t.addEventListener("click", () => {
      const n = +t.dataset.i;
      $$("#galMain img").forEach((im, k) => im.classList.toggle("on", k === n));
      $$("#thumbs img").forEach(x => x.classList.toggle("on", x === t));
      main.scrollTo({ left: n * main.clientWidth, behavior: "smooth" });
    }));
    main?.addEventListener("scroll", () => {
      const n = Math.round(main.scrollLeft / main.clientWidth);
      $$("#galDots i").forEach((d, k) => d.classList.toggle("on", k === n));
    }, { passive: true });

    $("#rvSend")?.addEventListener("click", async e => {
      const name = $("#rvName").value.trim(), text = $("#rvText").value.trim();
      if (!name || !text) return toast("Naam aur review dono likhein.", true);
      try {
        await db("perfume_reviews").insert({
          product_id: e.target.dataset.pid, customer_name: name, city: $("#rvCity").value.trim(),
          rating: +$("#rvRate").value, comment: text, is_approved: false });
        $("#rvName").value = $("#rvText").value = $("#rvCity").value = "";
        toast("Shukriya — approve hone ke baad show hoga.");
      } catch { toast("Review send nahi hua. Dobara koshish karein.", true); }
    });
  }

  /* search */
  const si = $("#sInput");
  if (si) {
    setTimeout(() => si.focus({ preventScroll: true }), 80);
    const run = v => {
      v = v.trim(); if (!v) return;
      recent = [v, ...recent.filter(r => r !== v)].slice(0, 6);
      LS.set("scentique_recent_v1", recent);
      location.hash = "#/search?q=" + encodeURIComponent(v);
    };
    si.addEventListener("keydown", e => { if (e.key === "Enter") run(si.value); });
    $("#sClear")?.addEventListener("click", () => location.hash = "#/search");
    $$("[data-sq]").forEach(b => b.addEventListener("click", () => run(b.dataset.sq)));
    $("#clearRecent")?.addEventListener("click", () => {
      recent = []; LS.set("scentique_recent_v1", recent); route();
    });
  }

  /* cart */
  $$("[data-inc]").forEach(b => b.addEventListener("click", () => {
    cart.find(x => x.id === b.dataset.inc).qty++; saveCart(); route();
  }));
  $$("[data-dec]").forEach(b => b.addEventListener("click", () => {
    const it = cart.find(x => x.id === b.dataset.dec);
    it.qty--; if (it.qty <= 0) cart = cart.filter(x => x.id !== it.id);
    saveCart(); route();
  }));
  $$("[data-del]").forEach(b => b.addEventListener("click", () => {
    cart = cart.filter(x => x.id !== b.dataset.del); saveCart(); route();
  }));

  $("#placeOrder")?.addEventListener("click", placeOrder);

  $("#cSend")?.addEventListener("click", async () => {
    const name = $("#cName").value.trim(), msg = $("#cMsg").value.trim();
    if (!name || !msg) return toast("Naam aur message likhein.", true);
    try {
      await db("perfume_messages").insert({ name, email: $("#cEmail").value.trim(),
        phone: $("#cPhone").value.trim(), message: msg });
      $("#cName").value = $("#cEmail").value = $("#cPhone").value = $("#cMsg").value = "";
      toast("Message bhej diya — hum jald rabta karenge.");
    } catch { toast("Message send nahi hua. WhatsApp try karein.", true); }
  });
}

function setParam(k, v) {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, query] = raw.split("?");
  const p = new URLSearchParams(query || "");
  v ? p.set(k, v) : p.delete(k);
  location.hash = "#/" + (path || "shop") + "?" + p.toString();
}
function bindFilterButtons(root) {
  $$("[data-f]", root).forEach(b => b.addEventListener("click", () => setParam(b.dataset.f, b.dataset.v)));
}

/* --------------------------------------------------- filter sheet */
function openSheet(params) {
  const sheet = $("#sheet");
  sheet.innerHTML = `<div class="grab"></div>
    <h3>Filter</h3>${filterFields(params)}
    <div class="sheet-actions">
      <button class="btn btn-quiet" id="sheetClear">Clear</button>
      <button class="btn" id="sheetDone">Show results</button>
    </div>`;
  sheet.classList.add("open"); $("#scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  bindFilterButtons(sheet);
  const r = $("#priceRange", sheet);
  r?.addEventListener("input", e => $("#priceOut", sheet).textContent = money(e.target.value));
  r?.addEventListener("change", e => setParam("max", e.target.value));
  $("#sheetDone").addEventListener("click", closeSheet);
  $("#sheetClear").addEventListener("click", () => {
    closeSheet();
    const cat = params.get("cat");
    location.hash = "#/shop" + (cat ? "?cat=" + cat : "");
  });
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  if (!$("#drawer").classList.contains("open")) $("#scrim").classList.remove("on");
  document.body.style.overflow = "";
}

/* ------------------------------------------------------ place order */
async function placeOrder() {
  const btn = $("#placeOrder");
  const bad = (id, ok) => { $(id).classList.toggle("bad", !ok); return ok; };
  const name = $("#coName").value.trim(), phone = $("#coPhone").value.trim();
  const city = $("#coCity").value.trim(), addr = $("#coAddr").value.trim();

  let ok = true;
  ok = bad("#fName", name.length > 1) && ok;
  ok = bad("#fPhone", /^\+?\d[\d\s-]{8,}$/.test(phone)) && ok;
  ok = bad("#fCity", city.length > 1) && ok;
  ok = bad("#fAddr", addr.length >= 10) && ok;
  if (!ok) { toast("Kuch details adhoori hain — highlighted fields dekh lein.", true); return; }

  const sub = cartSubtotal(), ship = shippingFor(sub);
  btn.disabled = true; btn.textContent = "Placing order…";
  try {
    const { data: order, error } = await db("perfume_orders").insert({
      customer_name: name, phone, city, address: addr,
      email: $("#coEmail").value.trim() || null, notes: $("#coNote").value.trim() || null,
      subtotal: sub, shipping: ship, total: sub + ship,
      payment_method: "Cash on Delivery", status: "pending"
    }).select().single();
    if (error) throw error;

    await db("perfume_order_items").insert(cart.map(i => ({
      order_id: order.id, product_id: i.id, product_name: i.name,
      size_ml: i.size_ml, price: i.price, qty: i.qty })));

    cart = []; saveCart();
    location.hash = "#/success/" + encodeURIComponent(order.order_number || order.id);
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = "Place order";
    toast("Order save nahi hua. WhatsApp par order kar lein.", true);
  }
}

/* ---------------------------------------------------------- global */
function bindGlobal() {
  const drawer = $("#drawer"), scrim = $("#scrim");
  const closeDrawer = () => { drawer.classList.remove("open"); scrim.classList.remove("on"); document.body.style.overflow = ""; };
  $("#burger").addEventListener("click", () => {
    drawer.classList.add("open"); scrim.classList.add("on"); document.body.style.overflow = "hidden";
  });
  scrim.addEventListener("click", () => { closeDrawer(); closeSheet(); });
  drawer.addEventListener("click", e => { if (e.target.closest("a") || e.target.closest("#drawerClose")) closeDrawer(); });
  addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); closeSheet(); } });

  let tick = false;
  addEventListener("scroll", () => {
    if (tick) return; tick = true;
    requestAnimationFrame(() => {
      $("#header").classList.toggle("scrolled", scrollY > 16);
      const bar = $("#buybar");
      if (bar && bar.innerHTML) bar.classList.toggle("on", scrollY > 380);
      tick = false;
    });
  }, { passive: true });

  addEventListener("hashchange", route);
}

(async function init() {
  try {
    bindGlobal();
    $("#app").innerHTML = `<section class="section"><div class="wrap">${skeletons(4)}</div></section>`;
    await loadAll();
    paintChrome();
    route();
  } catch (e) {
    console.error("Init error:", e);
    try { paintChrome(); route(); }
    catch { $("#app").innerHTML = `<section class="section"><div class="wrap">
      <div class="empty"><h3>Website load nahi ho saki</h3>
      <p>Page refresh karein. Masla rahe to browser console (F12) mein error dekhein.</p></div></div></section>`; }
  }
})();

})();
